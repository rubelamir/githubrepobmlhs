name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
    paths:
      - 'bmlhs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.rubelamir.site
          port: 21
          protocol: ftp
          username: bmlhs@bmlhs.site
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./bmlhs/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/*.sql
            database/**
