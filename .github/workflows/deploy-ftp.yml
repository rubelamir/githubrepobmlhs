name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.rubelamir.site
          port: 21
          protocol: ftp
          username: bmlhs@bmlhs.site
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cursor/**
            tests/**
            docs/**
            android/**
            node_modules/**
            *.sql
            *.csv
            *.md
            git.cmd
            netlify.toml
            .gitpod.yml
            .lgtm.yml
