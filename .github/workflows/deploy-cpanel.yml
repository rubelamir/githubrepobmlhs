name: Deploy website to cPanel

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed files
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
              echo "Refusing to deploy an initial branch push."
              exit 1
            fi
            git diff --name-only --diff-filter=ACMRT "$EVENT_BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-files.txt"
          else
            if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              echo "Cannot deploy because this commit has no parent."
              exit 1
            fi
            git diff --name-only --diff-filter=ACMRT HEAD^ HEAD > "$RUNNER_TEMP/deploy-files.txt"
          fi

      - name: Upload changed website files over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: python3 scripts/deploy_paths.py < "$RUNNER_TEMP/deploy-files.txt"
